<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Busca Rápida</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 8px;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .search-card {
        background: rgba(30, 34, 42, 0.96);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .search-header {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        gap: 12px;
      }
      .search-header i {
        font-size: 18px;
        color: #38bdf8;
      }
      .search-input {
        background: transparent;
        border: none;
        outline: none;
        color: #f8fafc;
        font-size: 16px;
        width: 100%;
      }
      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }
      .search-body {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .result-category {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.4);
        padding: 8px 10px 4px;
      }
      .result-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        color: #e2e8f0;
        transition: background 0.1s;
      }
      .result-item:hover, .result-item.selected {
        background: rgba(56, 189, 248, 0.15);
        color: #fff;
      }
      .result-left {
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: hidden;
      }
      .result-icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #94a3b8;
        font-size: 13px;
        flex-shrink: 0;
      }
      .result-item.selected .result-icon {
        background: #0284c7;
        color: #fff;
      }
      .result-title {
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .result-desc {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        margin-left: 6px;
      }
      .result-hint {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .search-footer {
        padding: 6px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="search-card">
      <div class="search-header">
        <i class="bi bi-search"></i>
        <input type="text" class="search-input" id="search-input" placeholder="Buscar contas, grupos, presets, ações (ou digite ? para ajuda)..." autofocus autocomplete="off" />
        <button class="btn btn-sm btn-link text-body-secondary p-0 text-decoration-none" id="btn-close"><kbd class="bg-dark text-white border-secondary">ESC</kbd></button>
      </div>

      <div class="search-body" id="results-list"></div>

      <div class="search-footer">
        <span>Navegue com <kbd>↑</kbd> <kbd>↓</kbd> e execute com <kbd>ENTER</kbd></span>
        <span>PW Manager · Busca Rápida</span>
      </div>
    </div>

    <script type="module" src="js/search.js"></script>
  </body>
</html>
